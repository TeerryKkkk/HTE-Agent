[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hte-agent"
version = "0.1.0"
description = "Reaction-condition optimization with surrogate-based batch search and bounded LLM assistance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hte-agent = "hte_agent.run:main"

[tool.setuptools.packages.find]
include = ["hte_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
